name: plan-scope

# Judges a plan run's PR diff against its plan's scope, read from the base
# commit (ADR 0042). The skill's approver path counts only a `plan-scope`
# check run from this job, so it relies on two properties held here:
# - the checker runs from the PR's base commit, never from the PR's tree, so
#   a PR cannot change what judges it;
# - the job runs only for `plan/` heads, so a non-plan PR's run concludes
#   `skipped`, never `success`.
#
# `edited` re-judges a plan PR against the base its event carries, so a PR
# retargeted onto the default branch is checked again without a push. A title
# or body edit re-runs the same check, which costs a minute and changes
# nothing unless the base moved; a push followed by a body update, as a plan
# run's checkpoint does, therefore costs two runs.
#
# `edited` also fires on a merged PR, and the skill reads the latest run after
# the merge, so a later edit re-judges the merged head against the base as it
# is then; if the scope has narrowed, the chain stops (admin: remove
# `plan:blocked` to accept). Every event adds a run record, so no `if:` can
# avoid this: a skipped run would stop it just the same. Leave a merged plan
# PR's title and body alone.
#
# A pass is judged against the base commit of the event that started it; a
# re-run reuses that event. Nothing here runs when the base branch moves, so
# if the admin narrows the allowlist or withdraws the plan after the last
# push, the old pass stands. The ruleset's "require branches to be up to
# date" closes that: the PR must take the new base, and that push runs the
# job against it.
#
# Check runs belong to a commit, not to a PR. A non-plan PR whose head is the
# same commit as a plan PR's adds a `skipped` run there, which becomes the
# latest; the skill reads the latest, so that voids the pass. It fails safe:
# push a new commit to the plan branch, or close the other PR and re-run.
#
# The merge-authority job (ADR 0043) decides whose approval a PR needs. An
# approval changes nothing on the head commit, and GitHub keeps a required
# check per triggering event, so a run started by a review event would never
# replace this workflow's failed `pull_request` run. Instead
# merge-authority-rerun.yml re-runs this run's merge-authority job when a
# review arrives (ADR 0045). Only `pull_request` starts this workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Reads the repository and nothing else; it writes nothing. merge-authority
# also reads reviews and check runs, and asks for that in its own job.
permissions:
  contents: read

jobs:
  # The ruleset requires `plan-scope` by name, and the skill looks it up by
  # name. Rename here, in the ruleset and in the skill together.
  plan-scope:
    name: plan-scope
    # A job-level condition, not a trigger filter: a filtered-out PR would get
    # no run at all, and a required check would wait on it forever.
    # `startsWith` ignores case, so `Plan/x` gets here too; the step below
    # fails it rather than let the checker skip it with a `success`.
    # Both refs come from the PR in the event rather than the context's
    # `head_ref` and `base_ref`, which are empty on events other than
    # `pull_request` (ADR 0044).
    if: ${{ startsWith(github.event.pull_request.head.ref, 'plan/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The base commit, with full history: the checker diffs base...head and
      # needs the merge-base. The default merge-ref checkout would be the PR's
      # tree. The token stays in the checkout's git config for the head fetch
      # below; it can only read, and nothing from the PR runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      # The launcher runs `python3 -I`, and the CLI imports PyYAML. Pinned by
      # hash and written from this workflow, as ci.yml does and for its
      # reasons. tests/trimtab/test_workflow_pins.py fails if the two
      # requirement blocks differ. merge-authority reuses both steps by
      # anchor, so the pin is written once in this file.
      - &setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - &pyyaml
        name: "python: PyYAML for the checker"
        run: |
          set -euo pipefail
          req="$RUNNER_TEMP/checker-requirements.txt"
          cat > "$req" <<'EOF'
          pyyaml==6.0.3 \
              --hash=sha256:b8bb0864c5a28024fac8a632c443c87c5aa6f215c0b126c449ae1a150412f31d \
              --hash=sha256:10892704fc220243f5305762e276552a0395f7beb4dbf9b14ec8fd43b57f126c
          EOF
          python3 -I -m pip install --require-hashes --only-binary=:all: -r "$req"

      # Every input comes from the event, passed through the environment and
      # never spliced into the script, so a branch name cannot inject shell.
      # The head's objects are fetched, never checked out: the checker reads
      # them through git, and the working tree stays the base's.
      - name: "plan-scope: the PR's diff is inside its plan's scope"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" != plan/* ]]; then
            echo "::error::head branch is not under plan/ (case matters); a run here must judge, never skip"
            exit 1
          fi
          checked_out=$(git rev-parse HEAD)
          if [[ "$checked_out" != "$BASE_SHA" ]]; then
            echo "::error::checkout is $checked_out, not the base $BASE_SHA; nothing is vouched for"
            exit 2
          fi
          git fetch --no-tags --no-recurse-submodules origin "$HEAD_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"
          ./bin/trimtab check-plan-scope \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --head-ref "$HEAD_REF" --base-ref "$BASE_REF" \
            --default-branch "$DEFAULT_BRANCH"


  # Whose approval the PR needs (ADR 0043, ADR 0044, ADR 0045): the admin's, or on a
  # plan run's PR the approver's with every plan-scope run on the head
  # passed. The ruleset requires `merge-authority` by name; rename here and
  # there together.
  #
  # It runs for every PR, after plan-scope, whatever plan-scope concluded:
  # the checker reads plan-scope's runs on the head itself, so a skipped or
  # failed plan-scope cannot pass a plan PR. `!cancelled()` rather than
  # `always()`, so a cancelled workflow stays cancelled, which is not a pass.
  #
  # This job runs the PR's own copy of this workflow, as every `pull_request`
  # job does, so a PR that edits it could make it pass. Code-owner review on
  # `.github/` closes that: GitHub enforces it outside the PR (ADR 0043).
  merge-authority:
    name: merge-authority
    needs: plan-scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reviews and check runs through the REST API; it writes nothing.
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      # The base branch's tip as the job starts, not the event's base commit:
      # a re-run after a review reuses its old event, whose base can predate
      # a change to the admin-only paths or the checker. The tip is the newest
      # rule, and the checker diffs from the merge-base, so the PR's own
      # changes are what it reads either way.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - *setup-python
      - *pyyaml

      # Two runs on one head can overlap: a push and an edit moments apart.
      # Judging while the other run's plan-scope is still going fails, and a
      # red run costs an autonomous run a fix round. So wait for every
      # plan-scope run on the head to finish, at most 5 minutes; after that
      # the checker judges and fails on the one still running. No
      # `concurrency:` group: it would cancel a plan-scope run, and a
      # cancelled run voids the head until the next push. A failed call
      # fails the step, which is not a pass.
      - name: "merge-authority: wait for plan-scope on the head"
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            running=$(gh api \
              "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=plan-scope&filter=all&per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions" and .status != "completed")] | length')
            if [[ "$running" == 0 ]]; then
              exit 0
            fi
            echo "plan-scope: $running run(s) still going on $HEAD_SHA; waiting"
            sleep 15
          done
          echo "::warning::plan-scope is still running after 5 minutes; judging now"

      # Inputs come from the event, through the environment, as in plan-scope.
      # The logins come from the repository's Actions variables, which a PR
      # cannot change (ADR 0044). TRIMTAB_APPROVER unset means no approver
      # review counts.
      - name: "merge-authority: the PR has the approval it needs"
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ADMIN: ${{ vars.TRIMTAB_ADMIN }}
          APPROVER: ${{ vars.TRIMTAB_APPROVER }}
        run: |
          set -euo pipefail
          if [[ -z "$ADMIN" ]]; then
            # A fork's PR may get no variables; the admin then bypasses, as
            # for the admin's own PRs (ADR 0044).
            echo "::error::TRIMTAB_ADMIN is empty: unset, or withheld from a fork's run; nothing is vouched for"
            exit 2
          fi
          base_sha=$(git rev-parse HEAD)
          echo "judging against $BASE_REF at $base_sha"
          git fetch --no-tags --no-recurse-submodules origin "$HEAD_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"
          ./bin/trimtab check-merge-authority \
            --repository "$REPOSITORY" --pr "$PR_NUMBER" \
            --base "$base_sha" --head "$HEAD_SHA" \
            --head-ref "$HEAD_REF" --head-repo "$HEAD_REPO" \
            --base-ref "$BASE_REF" --default-branch "$DEFAULT_BRANCH" \
            --admin "$ADMIN" --approver "$APPROVER"
