name: ci

on:
  push:
    branches: [main]
  pull_request:
    # No `ready_for_review`: it does not change the head commit, yet it re-ran
    # every check on a commit already tested.
    types: [opened, synchronize, reopened]

# Nothing here writes, and no step reads the PR through the API.
permissions:
  contents: read

jobs:
  # The single required context, and the only job: each separate job was
  # billed a whole minute for seconds of work. Each step keeps the name of the
  # job it came from. Every check step runs whatever an earlier one did
  # (`!cancelled()`), so one failure does not hide the next, and the job fails
  # if any did. Never add `continue-on-error`: it would leave that step
  # ungated. Removing jq runs last; the base expectations run first and hide jq
  # around their own fallback run (why is in their comment below). The ruleset
  # requires `lint-test` by name, so renaming this job silently un-requires
  # every check in it. Rename here and in the ruleset together.
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The base expectations read the base branch; the default depth-1
          # merge-ref checkout has no origin/<base>.
          fetch-depth: 0

      # --- guard matrix (base expectations), pull_request only.
      # The guard matrix below only proves the hooks agree with the tests
      # shipped beside them. A pull request can weaken hooks/ and edit
      # tests/guard-tests.sh to agree, and it stays green. These steps run the
      # BASE branch's expectations against the PR's hooks, so a behaviour
      # change has to be argued for rather than merely accompanied by an
      # edited test.
      #
      # First: every step shares this runner, and a step that ran PR code (with
      # GITHUB_ENV, GITHUB_PATH or sudo) can subvert any step after it. What
      # this order protects is the base expectations themselves: the base
      # branch's test file is materialised, and the python3-fallback run
      # starts, before anything the PR wrote can touch them. Both runs still
      # execute the PR's hooks; that is what they test. The jq-present run
      # follows those hooks as they ran in the fallback run, the exposure the
      # former separate job already had (its fallback followed its jq-present
      # run). The steps after these run the PR's own code directly anyway
      # (bin/trimtab, bootstrap.sh, with sudo), so a hook that taints them
      # gains nothing the PR does not already have.
      #
      # There is deliberately no override: no skip label, no env var, no
      # commit-message token, no marker file. Any of those would be reachable
      # by the same agent this gate constrains. If a base expectation
      # legitimately changed, this goes red and a human merges over it.
      #
      # CLAUDE_CONFIG_DIR proves the control-plane roots are absent rather
      # than relying on the runner image not happening to have a live install.
      # It is per step, so it never reaches a step that did not have it. ---
      - name: "base expectations: materialise the base branch's guard matrix"
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          CLAUDE_CONFIG_DIR: /tmp/claude-ci-no-home
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          # Written into tests/, NOT the runner temp dir: guard-tests.sh finds
          # the repository root from its own location, so a copy elsewhere
          # would look in the wrong tree.
          git show "origin/$GITHUB_BASE_REF:tests/guard-tests.sh" \
            > tests/base-guard-tests.sh
          chmod +x tests/base-guard-tests.sh

      # Moved aside, not removed, so it can be put back without the network.
      # It is removed for good at the end of the job.
      - name: "hide jq (the base python3 fallback runs next)"
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          jq_bin=$(command -v jq)
          printf '%s\n' "$jq_bin" > "$RUNNER_TEMP/jq.path"
          sudo mv "$jq_bin" "$RUNNER_TEMP/jq"
          if command -v jq; then echo "jq still present"; exit 1; fi

      - name: "base expectations: python3 fallback"
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          CLAUDE_CONFIG_DIR: /tmp/claude-ci-no-home
        run: ./tests/base-guard-tests.sh hooks

      - name: "restore jq"
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          sudo mv "$RUNNER_TEMP/jq" "$(cat "$RUNNER_TEMP/jq.path")"
          jq --version

      - name: "base expectations: hold against the PR's hooks (jq present)"
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          CLAUDE_CONFIG_DIR: /tmp/claude-ci-no-home
        run: ./tests/base-guard-tests.sh hooks

      # --- trimtab tests. This repository has no instance, so the tests that
      # need one skip themselves and there is no registry or lint step. Before
      # the fixture instance and bootstrap, which write outside the checkout;
      # the untracked tests/base-guard-tests.sh above does not affect them. ---
      - name: "trimtab: tests"
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tests/trimtab -v

      # --- public scrub. Nothing private-looking may reach this public
      # repository, and no workflow may run fork code with secrets. Before
      # bootstrap, which writes machine.json into the checkout. The untracked
      # tests/base-guard-tests.sh is the base branch's own public file. ---
      - name: "public scrub: no private-looking content in the public base"
        if: ${{ !cancelled() }}
        run: bin/trimtab scrub --public --tree . --self "$GITHUB_REPOSITORY"

      - name: "public scrub: no workflow runs untrusted fork code with secrets"
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/forbidden_triggers.py .github/workflows

      # --- guard matrix, jq present ---
      - name: "guard matrix: jq present"
        if: ${{ !cancelled() }}
        run: ./tests/guard-tests.sh hooks

      # The rule-usage observer has its own matrix, so a change to it needs a
      # gate too. It is hermetic (its own temp log, config directory and project
      # tree), so it needs no setup.
      - name: "guard matrix: rule-usage matrix"
        if: ${{ !cancelled() }}
        run: ./tests/rule-usage-tests.sh

      # --- bootstrap install, idempotency, drift check. If one of these
      # fails, the later ones will likely fail too; that is expected noise. ---

      # The installer reads the doctrine and the instance's own settings from an
      # instance, so CI builds a fixture one. The data home is redirected too, so
      # the installed snapshot store stays inside the runner's temp directory.
      # Both values are step outputs, passed to each bootstrap step by name,
      # not written to GITHUB_ENV: in one job that would reach every later
      # step, the python3-fallback guard matrix included.
      - name: "bootstrap: build a fixture instance"
        id: fixture
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          inst=$(python3 tests/trimtab/instance_fixture.py "$RUNNER_TEMP")
          echo "instance=$inst" >> "$GITHUB_OUTPUT"
          echo "data_home=$RUNNER_TEMP/share" >> "$GITHUB_OUTPUT"

      - name: "bootstrap: fresh install into a throwaway CLAUDE_CONFIG_DIR"
        if: ${{ !cancelled() }}
        env:
          CLAUDE_CONFIG_DIR: /tmp/claude-ci-home
          INSTANCE: ${{ steps.fixture.outputs.instance }}
          XDG_DATA_HOME: ${{ steps.fixture.outputs.data_home }}
        run: |
          ./bootstrap.sh --instance "$INSTANCE"
          test -L "$CLAUDE_CONFIG_DIR/hooks"
          test -L "$CLAUDE_CONFIG_DIR/bin"
          test -f "$CLAUDE_CONFIG_DIR/settings.json"
          test "$(readlink -f "$CLAUDE_CONFIG_DIR/rules")" = "$(readlink -f "$INSTANCE/rules")"

      - name: "bootstrap: second run is idempotent"
        if: ${{ !cancelled() }}
        env:
          CLAUDE_CONFIG_DIR: /tmp/claude-ci-home
          INSTANCE: ${{ steps.fixture.outputs.instance }}
          XDG_DATA_HOME: ${{ steps.fixture.outputs.data_home }}
        run: |
          out=$(./bootstrap.sh --instance "$INSTANCE")
          printf '%s\n' "$out"
          # An arrow marks a change; a second run must make none.
          if grep -q '→' <<<"$out"; then
            echo "second run was not idempotent"; exit 1
          fi

      - name: "bootstrap: --check reports in sync (exit 0)"
        if: ${{ !cancelled() }}
        env:
          CLAUDE_CONFIG_DIR: /tmp/claude-ci-home
          INSTANCE: ${{ steps.fixture.outputs.instance }}
          XDG_DATA_HOME: ${{ steps.fixture.outputs.data_home }}
        run: ./bootstrap.sh --instance "$INSTANCE" --check

      - name: "bootstrap: seeded drift is detected (exit 1)"
        if: ${{ !cancelled() }}
        env:
          CLAUDE_CONFIG_DIR: /tmp/claude-ci-home
          INSTANCE: ${{ steps.fixture.outputs.instance }}
          XDG_DATA_HOME: ${{ steps.fixture.outputs.data_home }}
        run: |
          rm "$CLAUDE_CONFIG_DIR/hooks"
          if ./bootstrap.sh --instance "$INSTANCE" --check; then
            echo "drift was not detected"; exit 1
          fi

      # A user timer lives in the operator's own systemd session, which no
      # CLAUDE_CONFIG_DIR can redirect. Bootstrap once wrote the timer into the
      # real unit directory even when sandboxed, so on a workstation the live
      # units ended up pointing into a git worktree. The steps above have already
      # run bootstrap three times; if the sandbox were leaking, the units would
      # be here.
      - name: "bootstrap: a sandboxed run leaves the real systemd user directory untouched"
        if: ${{ !cancelled() }}
        env:
          CLAUDE_CONFIG_DIR: /tmp/claude-ci-home
          INSTANCE: ${{ steps.fixture.outputs.instance }}
          XDG_DATA_HOME: ${{ steps.fixture.outputs.data_home }}
        run: |
          set -euo pipefail
          unit_dir="${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user"
          for u in rule-usage-report.timer rule-usage-report.service; do
            if [[ -e "$unit_dir/$u" || -L "$unit_dir/$u" ]]; then
              echo "sandboxed bootstrap wrote $unit_dir/$u — the timer step is"
              echo "ignoring CLAUDE_CONFIG_DIR again"
              exit 1
            fi
          done
          echo "no units in $unit_dir — sandbox held"

      # Bootstrap installs the checkout it sits in as the live source. Run from a
      # worktree and then remove that worktree, and the installed hooks dangle,
      # which silently disables every guard. It must refuse, and must refuse
      # before writing anything.
      - name: "bootstrap: installing from a linked worktree is refused"
        if: ${{ !cancelled() }}
        env:
          CLAUDE_CONFIG_DIR: /tmp/claude-ci-home
          INSTANCE: ${{ steps.fixture.outputs.instance }}
          XDG_DATA_HOME: ${{ steps.fixture.outputs.data_home }}
        run: |
          set -euo pipefail
          probe=/tmp/claude-ci-worktree-probe
          git worktree add --detach "$probe" HEAD >/dev/null
          before=$(ls -A "$CLAUDE_CONFIG_DIR" | sort | md5sum)
          if (cd "$probe" && ./bootstrap.sh --instance "$INSTANCE"); then
            echo "bootstrap installed from a linked worktree"; exit 1
          fi
          after=$(ls -A "$CLAUDE_CONFIG_DIR" | sort | md5sum)
          if [[ "$before" != "$after" ]]; then
            echo "refusal happened after touching $CLAUDE_CONFIG_DIR"; exit 1
          fi
          # The opt-in must still work, or an operator with a real reason has no
          # route at all. Sandboxed, so no timer is installed either way.
          (cd "$probe" && ./bootstrap.sh --instance "$INSTANCE" --allow-worktree >/dev/null)
          echo "refused by default, allowed with --allow-worktree"

      # The refusal must not fire on a canonical checkout reached through a
      # symlinked ancestor, as a dotfiles-style layout is. The current directory
      # as the shell reports it is logical while git reports it physically, so
      # comparing them directly once refused a plain clone and called it a
      # worktree. Every other test here uses direct paths, so only this one
      # would catch that.
      - name: "bootstrap: a canonical checkout behind a symlinked ancestor still installs"
        if: ${{ !cancelled() }}
        env:
          CLAUDE_CONFIG_DIR: /tmp/claude-ci-home
          INSTANCE: ${{ steps.fixture.outputs.instance }}
          XDG_DATA_HOME: ${{ steps.fixture.outputs.data_home }}
        run: |
          set -euo pipefail
          real=/tmp/claude-ci-symlink/real
          mkdir -p "$real" /tmp/claude-ci-symlink/home
          git clone -q --no-hardlinks . "$real/repo"
          ln -sfn "$real" /tmp/claude-ci-symlink/link
          # Its own clone, so canonical — and sandboxed, so no timer either way.
          (cd /tmp/claude-ci-symlink/link/repo \
            && CLAUDE_CONFIG_DIR=/tmp/claude-ci-symlink/home/.claude \
               ./bootstrap.sh --instance "$INSTANCE" >/dev/null)
          test -L /tmp/claude-ci-symlink/home/.claude/hooks
          echo "installed through the symlinked path"

      # bootstrap-env-tests.sh sets its own CLAUDE_CONFIG_DIR and XDG_DATA_HOME
      # per check; unsetting the step's value keeps it from installing over the
      # sandbox the steps above used.
      - name: "bootstrap: writes the instance's values and refuses a disabling layer"
        if: ${{ !cancelled() }}
        env:
          CLAUDE_CONFIG_DIR: /tmp/claude-ci-home
          INSTANCE: ${{ steps.fixture.outputs.instance }}
          XDG_DATA_HOME: ${{ steps.fixture.outputs.data_home }}
        run: env -u CLAUDE_CONFIG_DIR ./tests/bootstrap-env-tests.sh

      # --- last: remove jq, then the python3 fallback runs. A fresh machine
      # won't have jq; every guard must fall back to python3 and still fail
      # closed. ---
      - name: "remove jq (the python3 fallback runs below)"
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get remove -y jq >/dev/null
          if command -v jq; then echo "jq still present"; exit 1; fi

      - name: "guard matrix: python3 fallback"
        if: ${{ !cancelled() }}
        run: ./tests/guard-tests.sh hooks
